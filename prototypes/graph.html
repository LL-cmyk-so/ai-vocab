<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页原型 · 核心图谱 v3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f6f7fb; color: #1f2329; line-height: 1.5;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 0 14px 18px; }

  /* 头部（紧凑） */
  .site-header {
    background: linear-gradient(135deg, #4f6ef7 0%, #7c5cf0 100%);
    color: #fff; padding: 14px 0 12px;
  }
  .site-header h1 { font-size: 20px; font-weight: 800; text-align: center; }
  .subtitle { text-align: center; font-size: 11.5px; opacity: .92; margin-top: 2px; }

  /* 新手入口一行 */
  .begin-line { text-align: center; margin: 8px 0 2px; font-size: 13px; }
  .begin-line a { color: #4f6ef7; font-weight: 600; text-decoration: none; }

  /* 图谱卡片 */
  .graph-card {
    background: #fff; border-radius: 14px;
    box-shadow: 0 1px 3px rgba(31,35,41,.06);
    padding: 6px 6px 8px; margin-top: 6px;
  }
  #graph svg { width: 100%; height: auto; display: block; }

  /* 图例（一行，紧凑） */
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 10px; margin-top: 6px; font-size: 10px; color: #6b7280; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }

  /* 查看全部 + 搜索 + 热门（紧凑三行） */
  .all-link { text-align: center; margin-top: 8px; font-size: 13px; }
  .all-link a { color: #4f6ef7; font-weight: 600; text-decoration: none; }
  .mini-search { margin: 7px auto 0; max-width: 230px; text-align: center; }
  .mini-search input {
    width: 100%; padding: 5px 12px; font-size: 11px;
    border: 1px solid #e2e5ec; border-radius: 999px;
    background: #fff; color: #9aa0a8; outline: none;
  }
  .mini-search input::placeholder { color: #b8bdc9; }
  .hot-line { text-align: center; margin-top: 7px; font-size: 11px; color: #9aa0a8; }
  .hot-line a { color: #6b7280; text-decoration: none; margin: 0 4px; }
  .footer { text-align: center; margin-top: 8px; font-size: 10px; color: #c3c8d2; }

  /* 图谱元素 */
  .link-line { stroke: #d5dae3; stroke-width: 1; }
  .node-circle {
    stroke: #fff; stroke-width: 1.5; cursor: pointer;
    filter: drop-shadow(0 1px 2px rgba(31,35,41,.18));
  }
  .node-label {
    font-size: 10.5px; font-weight: 600; fill: #2b2f38;
    text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round;
  }
</style>
</head>
<body>

<header class="site-header">
  <h1>AI 词汇本</h1>
  <p class="subtitle">从 Agent 到 Token，用大白话看懂 AI 时代</p>
</header>

<div class="container">

  <div class="begin-line">✨ 新手？点这里 <a href="#">18 步走完看懂 AI →</a></div>

  <div class="graph-card">
    <div id="graph"></div>
    <div class="legend">
      <span><i style="background:#7c5cf0"></i>总纲</span>
      <span><i style="background:#4f6ef7"></i>地基</span>
      <span><i style="background:#3b82f6"></i>模型本体</span>
      <span><i style="background:#14b8a6"></i>交互层</span>
      <span><i style="background:#f59e0b"></i>应用层</span>
      <span><i style="background:#ef4444"></i>生态与前沿</span>
    </div>
  </div>

  <div class="all-link"><a href="#">📖 查看全部 77 词 →</a></div>
  <div class="mini-search"><input placeholder="🔍 搜索词条…"></div>
  <div class="hot-line">🔥 热门：<a href="#">Agent</a> · <a href="#">Token</a> · <a href="#">RAG</a> · <a href="#">幻觉</a> · <a href="#">AGI</a> · <a href="#">多模态</a></div>
  <div class="footer">原型 v3 · 非正式页面</div>
</div>

<script src="vendor/d3.v7.min.js"></script>
<script>
const LAYER_COLOR = {
  '总纲': '#7c5cf0', '地基': '#4f6ef7', '模型本体': '#3b82f6',
  '交互层': '#14b8a6', '应用层': '#f59e0b', '生态与前沿': '#ef4444'
};
// 节点：半径按核心度（9~18），文字统一放圆外下方
const WORDS = {
  'ai':         { name: '人工智能',   layer: '总纲',     size: 16 },
  'machine-learning': { name: '机器学习', layer: '地基',  size: 11 },
  'training':   { name: '训练',       layer: '地基',     size: 12 },
  'llm':        { name: '大语言模型', layer: '模型本体', size: 18 },
  'token':      { name: 'Token',      layer: '模型本体', size: 11 },
  'context-window': { name: '上下文窗口', layer: '模型本体', size: 11 },
  'transformer':{ name: 'Transformer',layer: '模型本体', size: 11 },
  'multimodal': { name: '多模态',     layer: '模型本体', size: 10 },
  'prompt':     { name: '提示词',     layer: '交互层',   size: 11 },
  'rag':        { name: 'RAG',        layer: '交互层',   size: 12 },
  'hallucination': { name: '幻觉',    layer: '交互层',   size: 11 },
  'vector-database': { name: '向量数据库', layer: '交互层', size: 11 },
  'agent':      { name: 'Agent',      layer: '应用层',   size: 16 },
  'tool-calling': { name: '工具调用', layer: '应用层',   size: 11 },
  'memory':     { name: '记忆',       layer: '应用层',   size: 10 },
  'agi':        { name: 'AGI',        layer: '生态与前沿', size: 15 },
  'alignment':  { name: '对齐',       layer: '生态与前沿', size: 12 },
  'api':        { name: 'API',        layer: '生态与前沿', size: 11 },
};
const LINKS = [
  ['ai','machine-learning'], ['ai','llm'], ['ai','agi'],
  ['machine-learning','training'], ['training','llm'],
  ['llm','token'], ['llm','transformer'], ['llm','context-window'], ['llm','multimodal'],
  ['token','context-window'], ['token','api'],
  ['context-window','memory'],
  ['prompt','llm'],
  ['rag','hallucination'], ['rag','vector-database'],
  ['vector-database','memory'],
  ['hallucination','alignment'], ['hallucination','prompt'],
  ['agent','tool-calling'], ['agent','memory'],
  ['tool-calling','api'],
  ['alignment','agi'], ['agi','ai'], ['alignment','rag']
];

const nodes = Object.entries(WORDS).map(([id, w]) => ({ id, ...w }));
const links = LINKS.map(([s, t]) => ({ source: s, target: t }));

// 一屏内显示：SVG 高度压缩到 420
const width = 700, height = 420;
const svg = d3.select('#graph').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .attr('preserveAspectRatio', 'xMidYMid meet');

const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.6, 3]).on('zoom', (e) => g.attr('transform', e.transform)));

const link = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link-line');

const node = g.append('g').selectAll('g').data(nodes).join('g').call(
  d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended)
);

// 圆点（不含文字）
node.append('circle')
  .attr('class', 'node-circle')
  .attr('r', d => d.size)
  .attr('fill', d => LAYER_COLOR[d.layer])
  .on('click', (e, d) => alert('词条：' + d.name));

// 文字统一放圆外下方，白底衬边，保证长词完整显示
node.append('text')
  .attr('class', 'node-label')
  .attr('dy', d => d.size + 11)
  .text(d => d.name);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(82).strength(0.5))
  .force('charge', d3.forceManyBody().strength(-380))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collide', d3.forceCollide().radius(d => d.size + 17))
  .on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

function dragstarted(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragended(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}
</script>
</body>
</html>
