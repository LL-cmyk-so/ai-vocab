<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI 词汇本</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="site-header">
  <!-- 常驻回首页（左） -->
  <button id="homeBtn" class="header-btn header-left" aria-label="回首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"></path>
      <path d="M5.5 10v9.5h13V10"></path>
    </svg>
  </button>
  <h1 id="siteTitle">AI 词汇本</h1>
  <p class="subtitle" id="siteSubtitle">零基础 AI 术语词典，不用懂编程，小白也能轻松读懂AI名词</p>
  <!-- 搜索入口（右，弱化） -->
  <button id="searchToggle" class="header-btn header-right" aria-label="搜索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
  </button>
</header>

<div class="container">

  <!-- 搜索面板 -->
  <div class="search-drop" id="searchDrop" hidden>
    <div class="search-bar">
      <input id="searchInput" placeholder="搜索词条…" autocomplete="off">
      <button id="searchClose" class="search-close" aria-label="关闭搜索">✕</button>
    </div>
    <div id="searchDropResults" class="search-results" hidden></div>
  </div>

  <!-- 首页：折叠目录树 -->
  <section id="homeView">
    <div id="homeMain">
      <div class="begin-line">✨ 新手？点这里 <a id="startLearnBtn" href="#">18 步走完看懂 AI →</a></div>
      <div class="tree" id="tree"></div>
      <div class="hot-line" id="hotLine"></div>
    </div>
  </section>

  <!-- 学习模式（18 步） -->
  <section id="learnView" hidden>
    <div class="learn-card">
      <div class="learn-top">
        <span class="learn-progress" id="learnProgress"></span>
        <button id="learnExit" class="learn-exit">✕ 退出学习</button>
      </div>
      <div id="learnBody"></div>
      <div class="learn-nav">
        <button id="learnPrev">← 上一步</button>
        <button id="learnNext">下一步 →</button>
      </div>
      <div class="learn-all"><a id="learnAllLink" href="#">查看全部 18 步</a></div>
    </div>
  </section>

  <!-- 18 步列表 -->
  <section id="pathView" hidden>
    <div class="card">
      <div class="card-title">🚀 零基础看懂 AI（18 步）</div>
      <div class="muted small" style="margin-bottom:10px">按顺序点下去，每一步看完点"下一步"继续。</div>
      <ul id="pathList" class="path-list"></ul>
    </div>
  </section>

  <!-- 词条详情 -->
  <section id="entryView" hidden>
    <div id="entryContent"></div>
  </section>

</div>

<footer class="site-footer">
  <div class="container muted small">
    AI 词汇本 · 内容为通俗科普，仅供学习参考<br>
    <span class="footer-dedication">献给我最喜欢的小鹦鹉sophie 🦜</span>
  </div>
</footer>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
