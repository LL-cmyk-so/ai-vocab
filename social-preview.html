<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    width: 1280px; height: 640px;
    background: linear-gradient(135deg, #0064FA 0%, #004FB3 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  /* 装饰圆 */
  .dot { position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); }
  .d1 { width: 420px; height: 420px; right: -120px; top: -140px; }
  .d2 { width: 300px; height: 300px; left: -100px; bottom: -120px; }
  .content { text-align: center; color: #fff; z-index: 1; }
  .title {
    font-size: 92px; font-weight: 800; letter-spacing: 4px;
  }
  .subtitle {
    margin-top: 18px;
    font-size: 34px; font-weight: 500; opacity: .92;
  }
  .url {
    margin-top: 26px;
    display: inline-block;
    font-size: 24px; font-weight: 600;
    background: rgba(255,255,255,.16);
    border-radius: 999px;
    padding: 10px 30px;
  }
</style>
</head>
<body>
  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="content">
    <div class="title">📖 AI 词汇本</div>
    <div class="subtitle">零基础 AI 术语词典 · 小白也能轻松读懂</div>
    <div class="url">LL-cmyk-so.github.io/ai-vocab</div>
  </div>
</body>
</html>
